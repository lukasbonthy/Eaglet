name: Build tiny Brotli decoder
on:
  push:
    branches:
      - size-lab
  workflow_dispatch:

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone browser decoder
        run: |
          npm install --no-save brotli@1.3.3 browserify@17 terser@5
          mkdir -p out
          npx browserify -r brotli/decompress:unbrotli -o out/unbrotli.js
          cat > out/entry.js <<'JS'
          globalThis.unbrotli = require("unbrotli");
          JS
          npx browserify out/entry.js -r brotli/decompress:unbrotli -o out/unbrotli.bundle.js
          npx terser out/unbrotli.bundle.js --compress passes=5 --mangle --ecma 2020 -o out/unbrotli.min.js
          node -e "const fs=require('fs'); console.log(fs.statSync('out/unbrotli.min.js').size)"
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-brotli-decoder
          path: out/unbrotli.min.js
          if-no-files-found: error
